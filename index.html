 <div class="g" style="margin-top:12px"><div class="k"><b>${s.pl}</b><span>ítems plásticos</span></div><div class="k"><b>${Math.round(s.pct)} %</b><span>con sustituto aceptado</span></div><div class="k"><b>${s.kg.toFixed(2)} kg</b><span>plástico evitado</span></div><div class="k"><b>${(s.d>=0?'+$':'-$')+fm(Math.abs(s.d))}</b><span>Δ costo por compra</span></div></div>
 <div class="m"><i style="width:${Math.min(100,s.pct)}%"></i><u style="left:${DB.regla.umbral}%"></u></div><p class="note">Umbral del Sello Azul: ${DB.regla.umbral} % (marcado en naranja). ${s.pend?'Hay ítems sin clasificar: no se emite Sello con resultados incompletos.':''}</p>
 ${se&&se.est==='vigente'?`<div class="seal"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="37" fill="#0a8f8f"/><path d="M28 40l9 9 16-18" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b style="font:700 19px Georgia,serif">Sello Azul vigente</b><br>Código: <code>${se.cod}</code><br><span class="note">Verifícalo en la pestaña «Verificar Sello». Vence ${new Date(se.v).toLocaleDateString('es-CO')}.</span><div class="row"><button class="s" id="ct">Ver certificado</button></div><div id="cert"></div></div></div>`:''}</div>`);
 el.querySelectorAll('input[data-n]').forEach(x=>x.onchange=async()=>{l.items[x.dataset.n].acc=x.checked;au('sustituto_'+(x.checked?'aceptado':'rechazado'),l.id);await sello(l);save();view()});
 el.querySelectorAll('select[data-m]').forEach(x=>x.onchange=async()=>{const n=x.dataset.m,i=l.items[n];if(!x.value)return;if(x.value==='__no'){l.items[n]={raw:i.raw,q:i.q,ty:'no'}}else{const c=DB.cat.items.find(y=>y.id===x.value);l.items[n]={raw:i.raw,q:i.q,ty:'pl',cat:c.id,n:c.n,s:c.s,w:c.w,c:c.c,sc:c.sc,conf:1,acc:false,src:'manual'};DB.cache[norm(i.raw).trim()]=c.id}const s=stats(l);l.estado=s.pend?'parcial':'lista';au('item_corregido',l.id);await sello(l);save();view()});
 const ctb=$('#ct');if(ctb)ctb.onclick=()=>certf(se);
 $('#all').onclick=async()=>{l.items.forEach(i=>{if(i.ty==='pl'&&i.conf>=.6)i.acc=true});await sello(l);save();view()}}
function vHist(el){const u=me(),ls=mine().slice().reverse();
 add(el,`<div class="card"><h2>Historial</h2><div class="tw"><table><thead><tr><th>Fecha</th><th>Estado</th><th>% sustituido</th><th>kg evitados</th><th></th></tr></thead><tbody>${ls.map(l=>{const s=stats(l);return`<tr><td>${new Date(l.t).toLocaleString('es-CO')}</td><td>${l.estado}</td><td>${Math.round(s.pct)} %</td><td>${s.kg.toFixed(2)}</td><td><a href="#lista-${l.id}">Abrir</a></td></tr>`}).join('')||'<tr><td colspan="5">Sin listas todavía.</td></tr>'}</tbody></table></div></div>`);}
function vCat(el){const u=me(),a=u.rol==='admin_plataforma';
 add(el,`<div class="card"><h2>Catálogo de insumos y sustitutos <span class="p no">v${DB.cat.v}</span></h2><p class="note">${a?'Como admin_plataforma puedes editar; cada cambio crea una versión y queda auditado.':'Solo lectura. Únicamente el rol admin_plataforma puede modificar el catálogo.'}</p>
 <div class="tw"><table><thead><tr><th>Insumo plástico</th><th>Peso (g)</th><th>Costo (COP)</th><th>Sustituto</th><th>Costo sust.</th></tr></thead><tbody>${DB.cat.items.map((c,n)=>`<tr><td>${esc(c.n)}</td><td>${c.w}</td><td>${a?`<input data-n="${n}" data-f="c" type="number" value="${c.c}" style="width:90px">`:c.c}</td><td>${esc(c.s)}</td><td>${a?`<input data-n="${n}" data-f="sc" type="number" value="${c.sc}" style="width:90px">`:c.sc}</td></tr>`).join('')}</tbody></table></div>
 ${a?'<div class="row"><button id="sv">Guardar nueva versión</button></div>':''}
 <h3 style="margin-top:16px">Regla del Sello Azul <span class="p no">v${DB.regla.v}</span></h3><p>Umbral: <b>${DB.regla.umbral} %</b> de ítems plásticos con sustituto aceptado (provisional).</p>${a?'<div class="row"><input id="um" type="number" min="1" max="100" value="'+DB.regla.umbral+'" style="width:90px"><button class="s" id="sr">Crear nueva versión de la regla</button></div>':''}</div>`);
 if(a){$('#sv').onclick=()=>{el.querySelectorAll('input[data-n]').forEach(x=>{const v=+x.value;if(v>0)DB.cat.items[x.dataset.n][x.dataset.f]=v});DB.cat.v++;au('catalogo_modificado','v'+DB.cat.v);save();flash='Catálogo guardado como versión '+DB.cat.v+'. Las listas anteriores conservan los valores con que se calcularon.';view()};
  $('#sr').onclick=()=>{const v=+$('#um').value;if(v>=1&&v<=100){DB.regla={v:DB.regla.v+1,umbral:v};au('regla_sello_nueva','v'+DB.regla.v+' '+v+'%');save();flash='Nueva regla v'+DB.regla.v;view()}}}}
function vAud(el){const u=me(),a=u.rol==='admin_plataforma',ev=DB.audit.filter(e=>a||e.cid===u.cid).slice().reverse().slice(0,80);
 add(el,`<div class="card"><h2>Registro de auditoría</h2><p class="note">Solo se agregan registros; sin contraseñas ni listas completas.${a?' Vista de administrador: todos los comercios.':''}</p><div class="tw"><table><thead><tr><th>Hora</th><th>Usuario</th><th>Evento</th><th>Detalle</th></tr></thead><tbody>${ev.map(e=>`<tr><td>${new Date(e.t).toLocaleString('es-CO')}</td><td>${esc(e.u)}</td><td><span class="p ${/denegado|fallido|bloqueado|revocado|limite/.test(e.ev)?'ba':'ok'}">${esc(e.ev)}</span></td><td>${esc(e.det)}</td></tr>`).join('')||'<tr><td colspan="4">Sin eventos.</td></tr>'}</tbody></table></div></div>`)}
function vVer(el){add(el,`<div class="card"><h2>Verificar un Sello Azul</h2><p class="note">Página pública: solo muestra comercio, fecha, vigencia y estado.</p><label for="c">Código del Sello</label><input id="c" placeholder="MLAI-XXXXXXXXXXXXXXXX" style="max-width:380px"><div class="row"><button id="vb">Verificar</button></div><div id="r"></div></div>`);
 $('#vb').onclick=()=>{const c=$('#c').value.trim().toUpperCase(),s=DB.sellos.find(x=>x.cod===c),r=$('#r');
  if(!s){r.innerHTML='<div class="msg">Código no válido.</div>';return}
  const exp=new Date(s.v)<new Date(),est=s.est==='revocado'?'Revocado':exp?'Vencido':'Vigente',cm=DB.com.find(x=>x.id===s.cid);
  r.innerHTML=`<div class="seal"><div><span class="p ${est==='Vigente'?'ok':'ba'}">${est}</span><br><b>${esc(cm.nom)}</b><br>Emitido: ${new Date(s.f).toLocaleDateString('es-CO')} · Vence: ${new Date(s.v).toLocaleDateString('es-CO')}<br><span class="note">Reconocimiento autodeclarado a partir de las listas del comercio; no es una certificación oficial.</span></div></div>`}}
const PROV=[['EcoEmpaques Caribe','Barranquilla',['vaso','plato','contenedor'],'24–48 h'],['Bagazo Costero','Cartagena',['plato','contenedor','cubierto'],'3 días'],['Papel & Tierra','Barranquilla',['bolsa','pitillo'],'24 h'],['Verde Mar Insumos','Santa Marta',['cubierto','pitillo','vaso'],'2–3 días']];
function vProv(el){add(el,`<h2>Proveedores locales de insumos ecológicos</h2><p class="note">Proveedores aliados del Caribe colombiano. Solicita una cotización directamente desde la plataforma.</p><div class="g">${PROV.map((p,n)=>`<div class="card"><h3>${p[0]}</h3><p>${p[1]} · entrega ${p[3]}</p><ul>${p[2].map(k=>{const c=DB.cat.items.find(x=>x.id===k);return c?`<li>${esc(c.s)} · $${fm(c.sc)} c/u</li>`:''}).join('')}</ul><div class="row"><button class="s" data-p="${n}">Solicitar cotización</button></div></div>`).join('')}</div>`);el.querySelectorAll('button[data-p]').forEach(b=>b.onclick=()=>{au('cotizacion_solicitada',PROV[b.dataset.p][0]);save();b.textContent='Solicitud registrada ';b.disabled=true})}
function vAcerca(el){add(el,`<div class="hero"><h1>Acerca de <em>MarLimpio AI</em></h1><p>Plataforma web para que restaurantes y hoteles del Caribe colombiano reemplacen plásticos de un solo uso. ODS 14 – Vida submarina, meta 14.1.</p></div><div class="g"><div class="card"><h3>Problema</h3><p>Las listas de compra están en texto libre y abreviado; clasificarlas a mano frena la transición. La Ley 2232 de 2022 y la Resolución 0803 de 2024 obligan a eliminar plásticos de un solo uso entre 2024 y 2030.</p></div><div class="card"><h3>Principio de diseño</h3><p>El LLM propone, el sistema determina: la IA solo interpreta el texto; costos, kg y Sello Azul se calculan con un catálogo versionado y reglas auditables.</p></div><div class="card"><h3>Seguridad y privacidad</h3><p>Aislamiento por comercio, límites de uso, auditoría, OWASP Top 10:2025 y minimización de datos hacia el LLM (Ley 1581 de 2012).</p></div></div><div class="card"><h3>Arquitectura</h3><p class="note">Navegador (SPA) → API backend → Worker (capa LLM, cálculo, Sello) ↔ API de LLM externa · PostgreSQL · auditoría · secretos.</p></div><div class="card"><h3>Equipo</h3><p>Yefrey Navarro Fontalvo · Julián Amell Romero · Jostyn Contreras Ariza · Reyner David Barbosa De La Rosa · Harley Seña Torres · Maria Palmet<br><span class="note">Universidad Simón Bolívar · Arquitectura de Software 2026-2 · Docente: Adriana María Iglesias Solano</span></p></div>`)}
init();
</script></body></html>
